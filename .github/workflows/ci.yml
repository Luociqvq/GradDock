name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: 构建并试打包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 主进程语法检查
        shell: bash
        run: |
          node --check electron/main.js
          node --check electron/preload.js

      - name: 构建渲染层
        run: npm run build

      - name: 打包 Windows 产物
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --config electron-builder.cjs 2>&1 | tee build.log

      # Actions 日志要登录才能看，失败时把尾巴开成公开 issue 方便远程排查
      - name: 失败时把日志开成 issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -c 40000 build.log 2>/dev/null || echo "(没有 build.log)"
            echo '```'
          } > report.md
          gh issue create --title "CI: Windows 打包失败（自动上报）" --body-file report.md

      - name: 留存产物（7 天）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: graddock-windows-build
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 7
